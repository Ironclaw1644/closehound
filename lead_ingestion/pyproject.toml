[project]
name = "lead-ingestion"
version = "0.1.0"
description = "CloseHound state-SOS lead ingestion (FL/GA/KY/NY) — Python sibling module."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CloseHound" }]
dependencies = [
    "supabase>=2.5,<3",
    "paramiko>=3.4,<4",
    "httpx>=0.27,<1",
    "dnspython>=2.6,<3",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.12,<4",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-paramiko>=3.4,<4",
    "types-beautifulsoup4>=4.12,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lead_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PTH"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = []

[[tool.mypy.overrides]]
module = ["supabase.*", "paramiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["lead_ingestion/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
